<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웅천중 이승우 AI 챗봇</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js (마크다운 렌더링용) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-900 h-screen flex flex-col text-white">

    <!-- 헤더 -->
    <header class="bg-red-900 text-white p-4 shadow-md flex justify-between items-center border-b border-red-700">
        <h1 class="text-xl font-bold">🔥 웅천중 이승우 AI</h1>
        <span class="text-xs bg-red-800 px-2 py-1 rounded text-red-200">자동 연동 모드</span>
    </header>

    <!-- 채팅 메시지 영역 -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <!-- 환영 메시지 -->
        <div class="flex items-start space-x-3">
            <div class="bg-red-700 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold flex-shrink-0">승우</div>
            <div class="bg-gray-800 border border-gray-700 p-4 rounded-2xl shadow-sm max-w-[80%] text-gray-100">
                .지홍이, 준성이 ,우현이 아 줴줴이야 엄 예? 아뇨아뇨아뇨
            </div>
        </div>
    </main>

    <!-- 입력창 영역 -->
    <footer class="bg-gray-800 border-t border-gray-700 p-4 shadow-lg">
        <form id="chat-form" onsubmit="handleSendMessage(event)" class="max-w-3xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="입력하세요." 
                class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-red-600"
                autocomplete="off"
                required
            >
            <button 
                type="submit" 
                class="bg-red-700 hover:bg-red-600 text-white px-6 py-2 rounded-lg font-medium transition"
            >
                전송
            </button>
        </form>
    </footer>

    <!-- JavaScript 로직 -->
    <script>
        // 여기에 본인의 Gemini API 키를 직접 입력해라! (예: "AIzaSy...")
        const apiKey = "AQ.Ab8RN6JfWYj4M4pkPnlVRswe9XiM4FQo2qpPhHR9HBWBVgztfQ";

        async function handleSendMessage(event) {
            event.preventDefault();
            const inputField = document.getElementById("user-input");
            const message = inputField.value.trim();
            if (!message) return;

            if (!apiKey || apiKey === "YOUR_API_KEY_HERE") {
                alert("준성이, 지홍이 아 줴줴이야.");
                return;
            }

            appendMessage(message, "user");
            inputField.value = "";

            try {
                const systemPrompt = "너는 웅천중학교에 다니는 '이승우'라는 이름의 학생이다. 말투는 항상 병신같고, 상대가 무슨 대답을 하면 처음에 쥐히랄을 말한다. 그리고 가끔씩 말 끝에 줴줴이야를 붙힌다. 그리고 상대가 부탁 혹은 질문을 하면 첫마디는 느금마 아니면 고아노 라고 말한다. 상대가 이름을 물어보면 웅천중 1짱 이승우라고한다. 그리고 키를 물어보면 154cm 라고 한다.";

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: systemPrompt }]
                        },
                        contents: [{ parts: [{ text: message }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    appendMessage(aiReply, "ai");
                } else {
                    appendMessage("우리 엄마 이름 보라", "ai");
                }
            } catch (error) {
                appendMessage("헌영대 교siu~!!: " + error.message, "ai");
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById("chat-container");
            const messageId = "msg-" + Date.now();
            const isUser = sender === "user";

            const messageDiv = document.createElement("div");
            messageDiv.id = messageId;
            messageDiv.className = `flex items-start space-x-3 ${isUser ? "flex-row-reverse space-x-reverse" : ""}`;

            const avatar = document.createElement("div");
            avatar.className = `rounded-full h-8 w-8 flex items-center justify-center font-bold flex-shrink-0 ${isUser ? "bg-gray-600 text-white" : "bg-red-700 text-white"}`;
            avatar.innerText = isUser ? "나" : "승우";

            const bubble = document.createElement("div");
            bubble.className = `p-4 rounded-2xl shadow-sm max-w-[80%] text-gray-100 ${isUser ? "bg-gray-700 border border-gray-600" : "bg-gray-800 border border-gray-700"}`;
            
            if (isUser) {
                bubble.innerText = text;
            } else {
                bubble.innerHTML = marked.parse(text);
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;

            return messageId;
        }
    </script>
</body>
</html>
